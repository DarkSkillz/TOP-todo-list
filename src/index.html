<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>
<body>

    <header>
        <div class="timeTab">Today</div>
        <div class="timeTab">This Week</div>
        <div class="timeTab">This Month</div>
        <div class="timeTab">This Year</div>
    </header>

    <aside>
        <div class="addProjectHolder">
            <button class="addProjectBtn">Add Project</button>
        </div>
        <div class="projectListDiv">
            <p>Your Project</p>
            <ul class="projectList">

            </ul>
        </div>
    </aside>

    <main>
        <div class="projectLabel">
            <p>Project3</p>
            <button class="addTask">Add Task</button>
            <button class="deleteProject">Delete Project</button>
        </div>
        <div class="timeLabel">Today</div>
        <section class="taskCardSection">
            <div class="taskCard">
                <div class="taskCardUpper">
                    <p class="taskName">Name</p>
                    <p class="taskParent">Parent Project</p>
                    <p class="taskDate">Due Date</p>
                    <p class="taskPriority">Priority</p>
                    <p class="taskStatus">Status</p>
                </div>
                <div class="taskCardLower">
                    <button class="taskEdit">Edit</button>
                    <button class="taskDelete">Delete</button>
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
